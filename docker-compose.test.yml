version: "3.9"

services:
  postgres_test:
    image: postgres:16
    container_name: postgres_test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: galpon_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5
